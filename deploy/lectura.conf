<VirtualHost *:80>
    ServerName lectura.local
    # ServerAlias www.example.com
    DocumentRoot /var/www/lectura/public

    <Directory /var/www/lectura/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Defence in depth: never serve dotfiles or SQL/log/backup files, even if one lands in public/
    <FilesMatch "^\.|\.(sql|log|bak|orig|swp|md)$">
        Require all denied
    </FilesMatch>

    # Only the front controllers below are PHP; nothing in assets/ should ever execute
    <Directory /var/www/lectura/public/assets>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/lectura_error.log
    CustomLog ${APACHE_LOG_DIR}/lectura_access.log combined
</VirtualHost>
